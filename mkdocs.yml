site_name: XoL - X-Plane on Linux
site_url: https://xol.emvisio.de/
site_description: X-Plane 12 on Linux — Tuning, Drivers, Scenery, and Tools
repo_url: https://github.com/mmaechtel/XoL
repo_name: XoL
edit_uri: ""

use_directory_urls: false

exclude_docs: |
  MARKDOWN_RULES.txt
  CHANGELOG
  assets/video/**


theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  logo: assets/favicon.png
  font: false
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.prune
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.sidebar
    #- navigation.instant          # incompatible with i18n language switcher
    #- navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    #- content.action.edit         # disabled — use GitHub Issues instead
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - announce.dismiss
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  language: de

extra_css:
  - stylesheets/fonts.css
  - stylesheets/nav.css

plugins:
  - social:
      cards_layout: xol
      enabled: !ENV [XOL_FULL_BUILD, true]
  - search:
      lang:
        - en
        - de
      separator: '[\s\-\.]+'
  - pub-obsidian:
      backlinks:
        enabled: false
